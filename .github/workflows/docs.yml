name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install main dependencies
        run: npm install

      - name: Build easepick2
        run: npm run prod

      - name: Copy dist files to docs public
        run: |
          mkdir -p docs/src/.vuepress/public/lib
          cp packages/bundle/dist/index.umd.js docs/src/.vuepress/public/lib/easepick2.js
          cp packages/bundle/dist/index.css docs/src/.vuepress/public/lib/easepick2.css

      - name: Install docs dependencies
        working-directory: docs
        run: npm install

      - name: Build VuePress site
        working-directory: docs
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/src/.vuepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
