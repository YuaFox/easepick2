name: Publish to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run prod

      - name: Publish @yuafox/easepick2-datetime
        run: npm publish --access public
        working-directory: packages/datetime
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2-core
        run: npm publish --access public
        working-directory: packages/core
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2-base-plugin
        run: npm publish --access public
        working-directory: packages/base-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2-lock-plugin
        run: npm publish --access public
        working-directory: packages/lock-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2-range-plugin
        run: npm publish --access public
        working-directory: packages/range-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2-preset-plugin
        run: npm publish --access public
        working-directory: packages/preset-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2-time-plugin
        run: npm publish --access public
        working-directory: packages/time-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2-kbd-plugin
        run: npm publish --access public
        working-directory: packages/kbd-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2-amp-plugin
        run: npm publish --access public
        working-directory: packages/amp-plugin
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @yuafox/easepick2 (bundle)
        run: npm publish --access public
        working-directory: packages/bundle
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
