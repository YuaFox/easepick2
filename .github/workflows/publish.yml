name: Publish to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run prod

      - name: Publish packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          publish_if_new() {
            local dir=$1
            local name=$(node -p "require('./$dir/package.json').name")
            local version=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$version" version 2>/dev/null; then
              echo "⏭ $name@$version already published, skipping"
            else
              echo "📦 Publishing $name@$version"
              npm publish --access public -w "$dir"
            fi
          }

          publish_if_new packages/datetime
          publish_if_new packages/core
          publish_if_new packages/base-plugin
          publish_if_new packages/lock-plugin
          publish_if_new packages/range-plugin
          publish_if_new packages/preset-plugin
          publish_if_new packages/time-plugin
          publish_if_new packages/kbd-plugin
          publish_if_new packages/amp-plugin
          publish_if_new packages/bundle
